# Auditoria de dependências + testes de segurança (sem Postgres/Supabase legado)
name: Security checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  security:
    name: Audit + security tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: NPM audit (fail on high or critical)
        run: npm audit --audit-level=high

      - name: Security unit tests
        run: npm run test:security

      - name: Integration tests (webhooks, auth)
        run: npm run test:integration -- --forceExit
